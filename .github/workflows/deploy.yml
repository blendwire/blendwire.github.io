name: Refresh data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'   # quick check for new releases; deploys only if something shipped
    - cron: '17 */3 * * *'   # full refresh: trending discovery, repo stats, extensions — always deploys
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  QUICK: ${{ github.event.schedule == '*/10 * * * *' && '1' || '0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ env.QUICK != '1' || steps.fetch.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch releases, builds, extensions & news
        id: fetch
        run: node scripts/fetch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build site
        if: env.QUICK != '1' || steps.fetch.outputs.changed == 'true'
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CNAME: ${{ vars.CNAME }}
      - name: Save data snapshot
        if: env.QUICK != '1' || steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || git commit -m 'Update data [skip ci]'
          git pull --rebase --autostash origin main && git push || echo 'push skipped'
      - uses: actions/upload-pages-artifact@v3
        if: env.QUICK != '1' || steps.fetch.outputs.changed == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
